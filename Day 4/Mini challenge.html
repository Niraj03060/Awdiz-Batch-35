<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Challenge</title>
</head>
<body>
    
     <h1>Feedback Form</h1>

    <form>

        <fieldset>
            <legend>User Feedback</legend>

          <!-- Name -->
            <label>Name:</label>
            <input type="text" placeholder="Niraj Parmar">
            <br><br>

            <!-- Email -->
            <label>Email:</label>
            <input type="email"  placeholder="eg : abc@gmail.com" >
            <br><br>

            <!-- Gender -->
            <label>Gender:</label>

            <input type="radio" name="gender" value="male"> Male

            <input type="radio" name="gender" value="female"> Female
            <br><br>


            <!-- Subscribe checkbox -->
            <input type="checkbox" name="subscribe now">
            Subscribe
            <br><br>

            <!-- Message text -->
            <label>Message:</label>
            <br>
            <textarea rows="6 cols="30"></textarea>
            <br><br>

            <!-- Submit button -->
            <button type="submit">Submit</button>

        </fieldset>

    </form>

</body>
</html>
